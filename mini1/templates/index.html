<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mountains of Meaning</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
     <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
    <script type="module" src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/audio.js') }}" defer></script>
</head>

<body>
    <main>
        <h1>Mountains of Meaning</h1>

        <form id="response-form"
              action="{{ url_for('submit_response') }}"
              method="post"
              data-words-url="{{ url_for('get_word') }}">

            <label for="response">What gives your life meaning?</label>

            <input type="text" id="response" name="response"
                   placeholder="Enter one word" required>

            <button type="submit">Submit</button>
        </form>

        <p id="response-message" role="status" aria-live="polite"></p>

        <div id="landscape"></div>
    </main>

   
 
</body>

</html>
